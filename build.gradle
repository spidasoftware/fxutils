plugins {
    id 'groovy'
    id 'java-library'
    id 'maven-publish'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
    maven { url = System.getenv("ARTIFACTORY_URL_EXPOSED") }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
		maven {
			url = System.getenv("ARTIFACTORY_URL_EXPOSED")
			credentials {
				username = System.getenv('ARTIFACTORY_USERNAME')
				password = System.getenv('ARTIFACTORY_PASSWORD')
			}
		}
	}
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

group = 'com.spidasoftware'
version = '1.0.6-SNAPSHOT'

String springVersion = "7.0.9"

dependencies {
    api 'org.apache.groovy:groovy:4.0.29'
    api "org.springframework:spring-context:${springVersion}"
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.17'
    testImplementation 'org.spockframework:spock-core:2.4-groovy-4.0'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.6.3'
    testRuntimeOnly 'org.objenesis:objenesis:3.4'   // so spock can mock classes
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.18.13'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

javafx {
    version = "21.0.9"
    modules = [ 'javafx.controls', 'javafx.fxml' ]
    configuration = 'api'
}

test {
    useJUnitPlatform()
}
